services:
  # GPU service with the fast (CUDA graph) backend
  qwen3-tts-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: qwen3-tts-api
    network_mode: host
    ports:
      - "8881:8881"
    environment:
      - HOST=0.0.0.0
      - PORT=8881
      - WORKERS=1
      - CORS_ORIGINS=*
      # fast = official model with captured CUDA graphs per decode step;
      # official = transformers generate() (slower than real time)
      - TTS_BACKEND=fast
      # Fuse the decode step with torch.compile, and store the talker and
      # code-predictor weights as int8 (quality measured equal to bf16).
      # Together ~6.5x real time on an RTX 4070 Ti; the first start compiles
      # for ~2 min, later starts reuse the cache volume below (~30 s).
      - TTS_COMPILE=true
      - TTS_QUANTIZE=int8
      # Capture the graph and run one generation at startup, not on the first request
      - TTS_WARMUP_ON_START=true
      # Use Base model for voice cloning support
      - TTS_MODEL_NAME=Qwen/Qwen3-TTS-12Hz-1.7B-Base
      # Load from the mounted cache without asking the Hub (the model must be cached)
      - HF_HUB_OFFLINE=1
      # Path to custom voice samples inside container
      - VOICE_SAMPLES_DIR=/app/voice-samples
      # Auto-unload model after N minutes of inactivity to free VRAM (0=disabled)
      # 0: Das Modell bleibt dauerhaft im VRAM (~5 GB). Neben gemma4:e2b (~2 GB)
      # ist auf der 12-GB-Karte genug Platz, und so gibt es keinen Kaltstart.
      - TTS_INACTIVITY_TIMEOUT_MINUTES=0
      # When using device_ids filter, the GPU appears as device 0 inside container
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      # Mount model cache for persistence
      - ~/.cache/huggingface:/home/appuser/.cache/huggingface
      # Mount custom voice samples for voice cloning
      - ./sample-voices-xtts:/app/voice-samples:ro
      # Compiled-kernel cache (torch.compile / Triton)
      - qwen3-tts-compile-cache:/home/appuser/.cache/compile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: unless-stopped
    # The server normally exits within a few seconds; more room than Docker's
    # default 10 s so it is never killed mid-shutdown
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8881/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # First start compiles for a few minutes
      start_period: 300s

  # GPU-enabled service with vLLM-Omni backend
  qwen3-tts-vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
    container_name: qwen3-tts-api-vllm
    network_mode: host
    ports:
      - "8880:8880"
    environment:
      - HOST=0.0.0.0
      - PORT=8880
      - WORKERS=1
      - CORS_ORIGINS=*
      - TTS_BACKEND=vllm_omni
      - TTS_WARMUP_ON_START=true
      - TTS_MODEL_NAME=Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    profiles:
      - vllm

  # CPU-only service
  qwen3-tts-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu-base
    container_name: qwen3-tts-api-cpu
    network_mode: host
    ports:
      - "8880:8880"
    environment:
      - HOST=0.0.0.0
      - PORT=8880
      - WORKERS=1
      - CORS_ORIGINS=*
      - TTS_BACKEND=official
    volumes:
      - ~/.cache/huggingface:/home/appuser/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    profiles:
      - cpu

volumes:
  qwen3-tts-compile-cache:

# To run GPU version with fast backend: docker-compose up qwen3-tts-gpu
# To run GPU version with vLLM backend: docker-compose --profile vllm up qwen3-tts-vllm
# To run CPU version: docker-compose --profile cpu up qwen3-tts-cpu
